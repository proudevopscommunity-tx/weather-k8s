apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  components:
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            type: NodePort
            ports:
              - name: status-port
                nodePort: 30000
                port: 15021
                protocol: TCP
                targetPort: 15021
              - name: http2
                nodePort: 30001
                port: 80
                protocol: TCP
                targetPort: 8080
              - name: https
                nodePort: 30002
                port: 443
                protocol: TCP
                targetPort: 8443
              - name: tls
                nodePort: 30003
                port: 15443
                protocol: TCP
                targetPort: 15443
  addonComponents:
    prometheus:
      enabled: true
    grafana:
      enabled: true
    kiali:
      enabled: true
    tracing:
      enabled: true  # Enables Jaeger Tracing
